[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-modernization-cli"
version = "0.1.0"
description = "Modernize a Java git repo:ref and publish it to a destination repo:branch"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
javamod = "javamod.cli:main"

[tool.setuptools.packages.find]
include = ["javamod*"]
